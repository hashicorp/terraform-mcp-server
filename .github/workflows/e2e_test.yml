name: E2E Tests
on:
  push:
    branches:
      - main
      - release/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-test:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: legacy server
            make_target: test-e2e
          - suite: official SDK - public Registry
            make_target: test-e2e-official-public-registry

    steps:
      - name: Check out code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        run: make deps

      - name: Run end-to-end tests
        run: make ${{ matrix.make_target }}
