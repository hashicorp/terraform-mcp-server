# Default values for terraform-mcp-server.

replicaCount: 1

image:
  repository: hashicorp/terraform-mcp-server
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  automount: true
  # Generated from the fullname template if empty and create is true.
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

# Maps to the server's environment variables.
mcpServer:
  # stateful or stateless. stateless is useful with multiple replicas behind a
  # load balancer that doesn't do session affinity.
  sessionMode: "stateful"
  # "0" disables it.
  heartbeatInterval: "0"
  # trace, debug, info, warn, error, fatal, panic.
  logLevel: "info"
  # text or json.
  logFormat: "json"
  # in streamable-http mode this can only be set here. clients can't override it
  # via header or query param.
  tfeAddress: "https://app.terraform.io"
  # comma-separated. empty with strict mode rejects all cross-origin requests.
  allowedOrigins: ""
  # strict, development, or disabled.
  corsMode: "strict"
  # restrict tool calls to these orgs. empty allows any org the token can reach.
  allowedOrganizations: []
  # the shared secret sent as the X-Tf-Mcp-Secret header. prefer existingSecret,
  # sharedSecret renders the value straight into the pod env.
  existingSecret: ""
  existingSecretKey: "shared-secret"
  sharedSecret: ""

otel:
  enabled: false
  metricsEndpoint: ""
  serviceName: "terraform-mcp-server"
