apiVersion: v1
kind: Service
metadata:
  name: {{ include "terraform-mcp-server.fullname" . }}
  labels:
    {{- include "terraform-mcp-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "terraform-mcp-server.selectorLabels" . | nindent 4 }}
