apiVersion: v2
name: terraform-mcp-server
description: A Helm chart for running the Terraform MCP Server on Kubernetes
type: application
# Chart version. Has to match appVersion: the release pipeline publishes the
# chart on the server's production release and then pulls it back by that same
# tag, so a mismatch fails the smoke test.
version: 1.3.0
# The version of terraform-mcp-server this chart deploys.
appVersion: "1.3.0"
home: https://github.com/hashicorp/terraform-mcp-server
sources:
  - https://github.com/hashicorp/terraform-mcp-server
maintainers:
  - name: HashiCorp
    url: https://github.com/hashicorp/terraform-mcp-server
